<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couchlog</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Couchlog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header id="topbar" hidden>
  <a class="brand" href="#/feed">🎬 Couchlog</a>
  <nav>
    <a href="#/feed">Feed</a>
    <a href="#/browse">Browse</a>
    <a href="#/reviews">Reviews</a>
    <a href="#/search">Search</a>
    <a href="#/me">Me</a>
    <a href="#/people">Friends</a>
  </nav>
  <button id="signout" class="ghost">Sign out</button>
</header>

<main id="view"></main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" id="modal-card"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
